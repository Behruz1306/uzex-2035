app = "uzex-2035"
primary_region = "fra"

[env]
  TZ = "UZT-5"
  SESSION_EVERY = "90"
  SESSION_OPEN = "25"
  PAY_WINDOW = "45"
  SHIP_DELAY = "10"
  TRANSIT = "40"
  ACCEPT_WINDOW = "300"
  SHIP_WINDOW = "300"
  FORWARD_WEEK_SECS = "120"
  PUBLIC_URL = "https://uzex-2035.fly.dev"

[[mounts]]
  source = "uzex_state"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2
